<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发票识别重命名</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2537; --border: #2a3550;
    --text: #e6ebf5; --dim: #8b96ad; --accent: #4f8cff; --accent2: #2f6fe4;
    --ok: #3ecf6e; --warn: #f0a63c; --err: #f0616d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin-bottom: 12px; color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  label.f { color: var(--dim); font-size: 12px; }
  select, input[type=text], input[type=password], input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 9px; font-size: 13px; outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  button {
    background: var(--accent2); color: #fff; border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--dim); }
  button.ghost:hover { color: var(--text); border-color: var(--dim); }
  button.danger { background: #a0343c; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 38px; background: var(--panel2); border: 1px dashed var(--border); border-radius: 8px; padding: 8px; margin: 10px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #243252; border: 1px solid #3a4d80; border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  .chip.sep { background: #202a40; border-color: var(--border); color: var(--dim); font-family: Consolas, monospace; }
  .chip .tag { color: var(--accent); font-size: 11px; margin-right: 2px; }
  .chip button { background: none; color: var(--dim); padding: 0 3px; font-size: 12px; cursor: pointer; }
  .chip button:hover { color: #fff; }
  .preview { background: #101826; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: Consolas, "Courier New", monospace; font-size: 13px; color: #a9d6ff; word-break: break-all; }
  .preview .hint { color: var(--dim); font-family: inherit; font-size: 12px; margin-top: 4px; }
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 26px; text-align: center; color: var(--dim); cursor: pointer; transition: all .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); background: rgba(79,140,255,.06); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid #1c2438; vertical-align: top; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .fname { font-family: Consolas, monospace; word-break: break-all; color: var(--dim); }
  .new { width: 100%; min-width: 240px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .badge.ok { background: rgba(62,207,110,.15); color: var(--ok); }
  .badge.partial { background: rgba(240,166,60,.15); color: var(--warn); }
  .badge.failed { background: rgba(240,97,109,.15); color: var(--err); }
  .ferr { color: var(--err); font-size: 12px; }
  .fchip { display: inline-block; background: #1c2438; border-radius: 4px; padding: 1px 6px; margin: 1px 2px; font-size: 12px; }
  .fchip b { color: var(--accent); font-weight: 500; }
  .actions { display: flex; gap: 10px; margin: 12px 0; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1d2537; border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; font-size: 13px; display: none; z-index: 99; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .muted { color: var(--dim); font-size: 12px; }
  .tbl-wrap { overflow-x: auto; }
</style>
</head>
<body>

<h1>🧾 发票识别重命名</h1>
<div class="sub">识别 PDF 发票内容 → 按模板生成文件名 → 批量重命名（支持撤销）。服务本地运行，配置保存在 config.yaml。</div>

<!-- ============ 配置 ============ -->
<div class="panel">
  <h2>⚙️ 解析与重命名设置</h2>
  <div class="row">
    <label class="f">提取模式</label>
    <select id="mode" onchange="onModeChange()">
      <option value="hybrid">混合（正则优先，缺字段走 LLM）</option>
      <option value="regex">仅本地正则（离线，不调 LLM）</option>
      <option value="llm">仅 LLM（所有字段走大模型）</option>
    </select>
    <span id="llmRow">
      <label class="f">LLM 提供商</label>
      <select id="llmProvider">
        <option value="deepseek">DeepSeek</option>
        <option value="custom">自定义（OpenAI 兼容）</option>
      </select>
      <label class="f">Base URL</label>
      <input type="text" id="llmBase" style="width:210px" placeholder="https://api.deepseek.com/v1">
      <label class="f">模型</label>
      <input type="text" id="llmModel" style="width:130px" placeholder="deepseek-chat">
      <label class="f">API Key（加密保存）</label>
      <span style="display:inline-flex;gap:6px;align-items:center">
        <input type="password" id="llmKey" style="width:200px" placeholder="sk-...">
        <button id="clearKeyBtn" onclick="clearKey()" style="display:none" title="清除已保存的 API Key">清除</button>
        <span id="keySaved" class="muted" style="font-size:12px"></span>
      </span>
    </span>
    <button onclick="saveConfig()">保存设置</button>
  </div>
  <div class="row"><span class="muted" id="modeHint"></span></div>
  <div class="row">
    <label class="f">重命名方式</label>
    <select id="output">
      <option value="inplace">原地重命名</option>
      <option value="subfolder">移入子文件夹</option>
    </select>
    <label class="f">子文件夹按</label>
    <select id="subfolderBy">
      <option value="month">月份（如 2026-08/）</option>
      <option value="seller">销售方</option>
    </select>
    <label class="f">重名冲突</label>
    <select id="conflict">
      <option value="suffix">自动加 _1/_2 后缀</option>
      <option value="skip">跳过并提示</option>
    </select>
    <span class="muted" id="saveHint"></span>
  </div>
</div>

<!-- ============ 命名模板 ============ -->
<div class="panel">
  <h2>📝 命名模板（点选组合，无需手敲字段）</h2>
  <div class="row">
    <select id="fieldSel"></select>
    <button onclick="addField()">＋ 添加字段</button>
    <span class="muted" style="margin:0 4px">分隔符：</span>
    <button class="ghost" onclick="addSep('_')">_</button>
    <button class="ghost" onclick="addSep('-')">-</button>
    <button class="ghost" onclick="addSep(' ')">空格</button>
    <button class="ghost" onclick="addSep('.')">.</button>
    <input type="text" id="customSep" style="width:60px" placeholder="其他">
    <button class="ghost" onclick="addCustomSep()">添加</button>
    <span style="flex:1"></span>
    <label class="f">预设：</label>
    <select id="preset" onchange="applyPreset()">
      <option value="default">日期_号码_销售方_金额</option>
      <option value="dni">日期_号码_金额</option>
      <option value="nis">号码_销售方_金额</option>
      <option value="sda">销售方_日期_金额</option>
      <option value="dtna">日期_票种_号码_金额</option>
    </select>
  </div>
  <div class="chips" id="templateChips"></div>
  <div class="row">
    <label class="f"><input type="checkbox" id="demoMissing" onchange="renderPreview()"> 演示：模拟某字段缺失（观察自动跳过）</label>
  </div>
  <div class="preview" id="preview"></div>
</div>

<!-- ============ 文件 ============ -->
<div class="panel">
  <h2>📂 文件</h2>
  <div class="sub">方式 A（推荐）：处理你电脑上的发票文件夹，<b>直接原地重命名</b>源文件</div>
  <div class="row">
    <label class="f">发票所在文件夹路径：</label>
    <input type="text" id="scanDir" style="flex:1" placeholder="例如 D:\发票 或 C:\Users\你\Desktop\发票">
    <button onclick="scan()">🔍 扫描（原地重命名）</button>
  </div>
  <div class="sub" style="margin-top:12px">方式 B：拖拽上传<b>副本</b>处理（源文件不会被修改；副本存于 uploads/ 目录，处理后可下载）</div>
  <div class="drop" id="drop">
    <div style="font-size:16px; margin-bottom:4px">拖拽 PDF 发票到这里，或点击选择文件</div>
    <div class="muted">仅上传副本，源文件保持不动</div>
    <input type="file" id="fileInput" multiple accept=".pdf" style="display:none">
  </div>
</div>

<!-- ============ 结果 ============ -->
<div class="panel" id="resultPanel" style="display:none">
  <h2>✅ 识别结果 <span class="muted" id="resultMeta"></span></h2>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th style="width:20%">原文件名</th><th>识别字段</th>
        <th style="width:24%">新文件名（可编辑，不含扩展名）</th><th>状态</th><th>操作</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="actions">
    <button onclick="renameAll()">🚀 全部重命名</button>
    <button class="ghost" onclick="reparse()">↻ 用当前设置重新解析</button>
    <button class="danger" onclick="undo()">↩ 撤销上次重命名</button>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let template = [];   // [{t:'field'|'sep', v:...}]
let items = [];      // 当前解析结果
let lastDir = null;  // 用于重命名后刷新
let labels = {};

const DEMO_FIELDS = {
  invoice_no: "25512345678901234567", date: "2026-08-15",
  seller: "深圳市某某科技有限公司", buyer: "北京某某商贸有限公司",
  amount: "100.00", amount_cn: "壹佰元整", type: "电子普通发票",
  seller_tax_id: "91440300MA5XXXXXX1", buyer_tax_id: "91110108XXXXXXXX2"
};

const PRESETS = {
  default: [["field","date"],["sep","_"],["field","invoice_no"],["sep","_"],["field","seller"],["sep","_"],["field","amount"]],
  dni:     [["field","date"],["sep","_"],["field","invoice_no"],["sep","_"],["field","amount"]],
  nis:     [["field","invoice_no"],["sep","_"],["field","seller"],["sep","_"],["field","amount"]],
  sda:     [["field","seller"],["sep","_"],["field","date"],["sep","_"],["field","amount"]],
  dtna:    [["field","date"],["sep","_"],["field","type"],["sep","_"],["field","invoice_no"],["sep","_"],["field","amount"]]
};

function toast(msg, ms=3500) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms);
}
async function api(path, opts={}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = `HTTP ${r.status}`; try { m = (await r.json()).detail || m; } catch(e){} throw new Error(m); }
  return r.json();
}

/* ---------- 配置 ---------- */
function onModeChange() {
  const m = $('mode').value;
  $('llmRow').style.display = m === 'regex' ? 'none' : 'inline';
  const hints = {
    regex: '当前：仅本地正则 — 离线运行，不调用任何 LLM，无需 API Key。',
    hybrid: '当前：混合模式 — 正则优先，关键字段缺失时自动调用 LLM 补全。',
    llm: '当前：仅 LLM — 所有字段都由大模型提取，需要配置 API Key。'
  };
  $('modeHint').textContent = hints[m];
}
function parsingToast() {
  return {
    regex: '解析中…（仅本地正则，不调用 LLM）',
    hybrid: '解析中…（hybrid 模式，缺字段才调 LLM，请稍候）',
    llm: '解析中…（LLM 模式，请稍候）'
  }[$('mode').value];
}
async function loadConfig() {
  const cfg = await api('/api/config');
  $('mode').value = cfg.extraction.mode;
  $('llmProvider').value = cfg.llm.provider === 'custom' ? 'custom' : 'deepseek';
  $('llmBase').value = cfg.llm.base_url;
  $('llmModel').value = cfg.llm.model;
  // key 不回传明文：显示脱敏信息，输入框留空（输入即覆盖）
  $('llmKey').value = '';
  if (cfg.llm.has_api_key) {
    $('keySaved').textContent = '已保存 ' + (cfg.llm.api_key_masked || '');
    $('clearKeyBtn').style.display = '';
  } else {
    $('keySaved').textContent = '';
    $('clearKeyBtn').style.display = 'none';
  }
  $('output').value = cfg.naming.output;
  $('subfolderBy').value = cfg.naming.subfolder_by;
  $('conflict').value = cfg.naming.conflict;
  template = cfg.naming.template || PRESETS.default;
  renderTemplate();
  onModeChange();
}
function clearKey() {
  $('llmKey').value = '';
  $('llmKey').dataset.clear = '1';
  $('keySaved').textContent = '';
  $('clearKeyBtn').style.display = 'none';
  toast('将清除已保存的 API Key，点「保存设置」生效');
}
async function saveConfig() {
  const llm = {
    provider: $('llmProvider').value,
    base_url: $('llmBase').value.trim(),
    model: $('llmModel').value.trim()
  };
  const typed = $('llmKey').value.trim();
  if (typed) {
    llm.api_key = typed;                 // 输入了新 key → 覆盖
  } else if ($('llmKey').dataset.clear === '1') {
    llm.api_key = '__clear__';           // 点了清除 → 删除
  }
  // 未输入且未点清除 → 不传 api_key 字段，后端保留原 key
  const body = {
    extraction: { mode: $('mode').value },
    llm: llm,
    naming: {
      template: template,
      output: $('output').value,
      subfolder_by: $('subfolderBy').value,
      conflict: $('conflict').value
    }
  };
  try {
    const res = await api('/api/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({config: body}) });
    delete $('llmKey').dataset.clear;
    $('llmKey').value = '';
    if (res.has_api_key) {
      $('keySaved').textContent = '已保存 ' + (res.api_key_masked || '');
      $('clearKeyBtn').style.display = '';
    } else {
      $('keySaved').textContent = '';
      $('clearKeyBtn').style.display = 'none';
    }
    $('saveHint').textContent = '✓ 已保存 ' + new Date().toLocaleTimeString();
    toast('设置已保存');
  } catch(e) { toast('保存失败：' + e.message, 5000); }
}

/* ---------- 模板拼接器 ---------- */
function renderTemplate() {
  const box = $('templateChips'); box.innerHTML = '';
  template.forEach((seg, i) => {
    const d = document.createElement('span');
    if (seg.t === 'field') {
      d.className = 'chip';
      d.innerHTML = `<span class="tag">字段</span>${labels[seg.v] || seg.v}`;
    } else {
      d.className = 'chip sep';
      d.innerHTML = `<span class="tag">分隔</span>${seg.v === ' ' ? '␣' : seg.v}`;
    }
    const up = document.createElement('button'); up.textContent = '↑'; up.title='上移';
    up.onclick = () => moveSeg(i, -1);
    const dn = document.createElement('button'); dn.textContent = '↓'; dn.title='下移';
    dn.onclick = () => moveSeg(i, 1);
    const rm = document.createElement('button'); rm.textContent = '✕'; rm.title='删除';
    rm.onclick = () => { template.splice(i,1); renderTemplate(); };
    d.append(up, dn, rm);
    box.appendChild(d);
  });
  renderPreview();
}
function moveSeg(i, delta) {
  const j = i + delta;
  if (j < 0 || j >= template.length) return;
  [template[i], template[j]] = [template[j], template[i]];
  renderTemplate();
}
function addField() {
  const v = $('fieldSel').value;
  template.push({t:'field', v});
  renderTemplate();
}
function addSep(s) { template.push({t:'sep', v:s}); renderTemplate(); }
function addCustomSep() {
  const s = $('customSep').value;
  if (s) addSep(s);
}
function applyPreset() {
  template = PRESETS[$('preset').value].map(([t,v]) => ({t,v}));
  renderTemplate();
}
function renderTemplateJS(tpl, fields) {
  const tokens = []; let pendingSep = null;
  for (const seg of tpl) {
    if (seg.t === 'field') {
      const val = (fields[seg.v] || '').trim();
      if (val) { if (pendingSep !== null && tokens.length) tokens.push(pendingSep); pendingSep = null; tokens.push(val); }
    } else pendingSep = seg.v;
  }
  return tokens.join('');
}
function renderPreview() {
  const demo = {...DEMO_FIELDS};
  if ($('demoMissing').checked) demo.date = '';
  const name = renderTemplateJS(template, demo);
  const missed = template.filter(s => s.t==='field' && !(demo[s.v]||'').trim()).map(s => labels[s.v]||s.v);
  $('preview').innerHTML = `示例：<b>${name}.pdf</b>` +
    (missed.length ? `<div class="hint">演示中缺失字段：${missed.join('、')} → 自动跳过，分隔符自动折叠</div>` : `<div class="hint">所有字段齐全，正常拼接</div>`);
}

/* ---------- 文件 ---------- */
function setupDrop() {
  const drop = $('drop'), input = $('fileInput');
  drop.onclick = () => input.click();
  input.onchange = () => { if (input.files.length) upload(input.files); };
  ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) upload(e.dataTransfer.files); });
}
async function upload(files) {
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  toast(parsingToast(), 8000);
  try {
    const res = await api('/api/upload', { method:'POST', body: fd });
    lastDir = res.upload_dir;
    items = res.items; renderTable(); renderMeta();
  } catch(e) { toast('上传/解析失败：' + e.message, 6000); }
}
async function scan() {
  const dir = $('scanDir').value.trim();
  if (!dir) { toast('请输入文件夹路径'); return; }
  toast(parsingToast(), 8000);
  try {
    const res = await api('/api/scan', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({dir}) });
    lastDir = dir; items = res.items; renderTable(); renderMeta();
    if (!res.count) toast('该文件夹没有找到 PDF 文件');
  } catch(e) { toast('扫描失败：' + e.message, 6000); }
}
function renderMeta() {
  const ok = items.filter(i => i.status==='ok').length;
  $('resultMeta').textContent = `共 ${items.length} 个文件，完整识别 ${ok} 个`;
  $('resultPanel').style.display = 'block';
}
function renderTable() {
  const tb = $('tableBody'); tb.innerHTML = '';
  items.forEach((it, idx) => {
    const tr = document.createElement('tr');
    const fieldChips = Object.entries(it.fields).filter(([,v]) => v).map(([k,v]) =>
      `<span class="fchip"><b>${labels[k]||k}</b> ${v}</span>`).join('');
    const badge = {ok:'✓ 完整', partial:'⚠ 部分', failed:'✕ 失败'}[it.status];
    tr.innerHTML = `
      <td><div class="fname">${it.filename}</div></td>
      <td>${fieldChips || '<span class="ferr">未识别到字段</span>'}
          ${it.llm_used ? '<span class="fchip">🤖 LLM补全</span>' : ''}
          ${it.llm_error ? `<div class="ferr">LLM: ${it.llm_error}</div>` : ''}
          ${it.errors.map(e => `<div class="ferr">${e}</div>`).join('')}</td>
      <td><input class="new" data-idx="${idx}" value="${it.suggested}" placeholder="${it.filename}"></td>
      <td><span class="badge ${it.status}">${badge}</span></td>
      <td>${it.downloadable ? `<a class="ghost dl" href="/api/download?file=${encodeURIComponent(it.download_name)}" target="_blank" style="text-decoration:none">⬇ 下载</a>` : ''}</td>`;
    tb.appendChild(tr);
  });
}
function currentNewNames() {
  return [...document.querySelectorAll('.new')].map(inp => ({
    src: items[+inp.dataset.idx].src,
    new_name: inp.value.trim(),
    fields: items[+inp.dataset.idx].fields
  }));
}
async function renameAll() {
  if (!items.length) return;
  toast('重命名中…');
  try {
    const res = await api('/api/rename', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({items: currentNewNames()}) });
    let ok = 0, fails = [];
    res.results.forEach(r => r.ok ? ok++ : fails.push(r.message));
    toast(`重命名完成：成功 ${ok} 个` + (fails.length ? `；失败 ${fails.length} 个（${fails[0]}）` : ''), 6000);
    if (lastDir) { const r2 = await api('/api/scan', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({dir: lastDir}) }); items = r2.items; renderTable(); }
  } catch(e) { toast('重命名失败：' + e.message, 6000); }
}
async function reparse() {
  if (!items.length) return;
  toast('重新解析中…', 8000);
  try {
    const res = await api('/api/parse', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({paths: items.map(i => i.src)}) });
    items = res.items; renderTable();
    toast('解析完成');
  } catch(e) { toast('解析失败：' + e.message, 6000); }
}
async function undo() {
  try {
    const res = await api('/api/undo', { method:'POST' });
    toast(res.message, 6000);
    if (lastDir) { const r2 = await api('/api/scan', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({dir: lastDir}) }); items = r2.items; renderTable(); }
  } catch(e) { toast('撤销失败：' + e.message, 6000); }
}

/* ---------- 初始化 ---------- */
(async function init() {
  labels = (await api('/api/fields')).labels;
  const sel = $('fieldSel');
  sel.innerHTML = Object.entries(labels).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
  setupDrop();
  await loadConfig();
})();
</script>
