<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 概念 A：发票 + 循环重命名徽章。白+蓝，Notion/Linear 气质 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E7BFA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="paperShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0B2A85" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 底：圆角方块（Windows 11 气质），渐变与界面 135deg 一致 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- 发票纸张（白色，带柔和投影） -->
  <g filter="url(#paperShadow)">
    <rect x="272" y="252" width="480" height="520" rx="44" fill="#ffffff"/>
    <!-- 右上折角 -->
    <path d="M 752 252 L 752 336 L 668 252 Z" fill="#D9E2F5"/>
    <path d="M 752 336 L 668 252 L 752 252 Z" fill="#EDF2FC"/>
  </g>

  <!-- 纸上内容线条（发票文本行） -->
  <rect x="344" y="368" width="210" height="28" rx="14" fill="#D6DFF1"/>
  <rect x="344" y="442" width="300" height="28" rx="14" fill="#D6DFF1"/>
  <rect x="344" y="516" width="360" height="28" rx="14" fill="#D6DFF1"/>

  <!-- 重命名徽章：蓝色圆章 + 白色 ⇄ 双箭头（识别 → 重命名） -->
  <circle cx="700" cy="700" r="152" fill="#2563EB"/>
  <circle cx="700" cy="700" r="152" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="18"/>
  <!-- 左箭头（朝左） -->
  <path d="M 640 640 L 574 700 L 640 760" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 574 700 H 812" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
  <!-- 右箭头（朝右） -->
  <path d="M 760 640 L 826 700 L 760 760" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
