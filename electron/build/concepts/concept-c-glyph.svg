<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 概念 C：单字标记「票」— Linear 式极简字母标记 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E7BFA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- 底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- 「票」字（白色粗体，微软雅黑） -->
  <text x="512" y="728" text-anchor="middle" font-family="'Microsoft YaHei','Microsoft YaHei UI','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="620" font-weight="700" fill="#FFFFFF">票</text>

  <!-- 底部小点缀：蓝色下划线（命名/文件名语义） -->
  <rect x="302" y="790" width="420" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.22"/>
</svg>
