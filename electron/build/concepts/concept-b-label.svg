<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 概念 B：发票 + 命名标签条（给发票贴名字 → 重命名） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E7BFA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="paperShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0B2A85" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- 发票纸张 -->
  <g filter="url(#paperShadow)">
    <rect x="292" y="262" width="440" height="500" rx="44" fill="#ffffff"/>
  </g>

  <!-- 命名标签条：从纸左缘探出，蓝色，内含白色文件名行 -->
  <rect x="248" y="372" width="528" height="112" rx="30" fill="#2563EB"/>
  <rect x="330" y="408" width="190" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="330" y="444" width="250" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- 纸上剩余内容行（发票文本） -->
  <rect x="368" y="560" width="280" height="26" rx="13" fill="#D6DFF1"/>
  <rect x="368" y="624" width="220" height="26" rx="13" fill="#D6DFF1"/>
  <rect x="368" y="688" width="260" height="26" rx="13" fill="#D6DFF1"/>
</svg>
