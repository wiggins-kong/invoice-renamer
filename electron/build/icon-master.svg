<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 发票识别重命名 · 程序图标（v3.1 重设计 方案D：发票 + 绿色对勾徽章,居中版）
       视觉世界延续 v3.0 界面:深蓝渐变 accent/v3.0(#1e40af 系)+圆角卡片+扁平简洁,
       绿勾 = 「识别并命名完成」一步到位 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6CF0"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="paperShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0B1F5C" flood-opacity="0.42"/>
    </filter>
    <filter id="badgeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0B1F5C" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- 底：圆角方块，135° 渐变与界面强调色一致 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- 发票纸张（白色主体，居中，柔和投影浮起） -->
  <g filter="url(#paperShadow)">
    <rect x="205" y="205" width="614" height="614" rx="68" fill="#ffffff"/>
  </g>

  <!-- 抬头条：蓝色，发票文档头部 -->
  <rect x="256" y="273" width="512" height="111" rx="30" fill="#3B6CF0"/>

  <!-- 纸上内容行（识别出的发票文本节奏） -->
  <rect x="256" y="452" width="400" height="43" rx="21" fill="#C9D2E5"/>
  <rect x="256" y="563" width="400" height="43" rx="21" fill="#C9D2E5"/>

  <!-- 绿色对勾徽章：压发票右上角（发票右上角盖戳的现实认知），整体居中平衡 -->
  <g filter="url(#badgeShadow)">
    <circle cx="734" cy="290" r="145" fill="#1ED5A5" stroke="#FFFFFF" stroke-width="30"/>
    <path d="M666 290 l51 51 85-102" stroke="#FFFFFF" stroke-width="38" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
