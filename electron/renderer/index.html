<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发票识别重命名</title>
<style>
/* ============================================================
   布局重构 v2.9：单列工作流 + Mica 云母材质
   - 单列自上而下 = 工作流顺序：拖入 → 配模板 → 看结果 → 重命名
   - 高频(结果表格)拿最大面积，低频(设置)收进顶栏弹窗
   - 卡片 = 半透明玻璃，层层叠在云母背景上（Windows 11 由主进程
     setBackgroundMaterial('mica') 提供真材质；旧系统自动降级纯色）
   ============================================================ */
:root {
  --mica-top: rgba(242, 246, 253, 0.86);
  --mica-bottom: rgba(233, 240, 252, 0.58);
  --glass: rgba(255, 255, 255, 0.70);
  --glass-strong: rgba(255, 255, 255, 0.88);
  --glass-2: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.78);
  --line: rgba(60, 76, 110, 0.14);
  --line-strong: rgba(60, 76, 110, 0.28);
  --text: #1c2333;
  --text-2: #5a6478;
  --text-3: #8a93a8;
  --accent: #2b5fd9;
  --accent-hover: #1f4fc0;
  --accent-soft: rgba(43, 95, 217, 0.10);
  --accent-soft-strong: rgba(43, 95, 217, 0.20);
  --accent-text: #2b5fd9;
  --on-accent: #ffffff;
  --ok: #1d8a4e; --ok-soft: rgba(29, 138, 78, .12);
  --warn: #b45309; --warn-soft: rgba(180, 83, 9, .12);
  --err: #d43d4f; --err-soft: rgba(212, 61, 79, .10);
  --focus: 0 0 0 3px rgba(43, 95, 217, .20);
  --shadow-sm: 0 1px 3px rgba(30, 41, 66, .08), 0 0 0 0.5px var(--line);
  --shadow-md: 0 8px 28px rgba(30, 41, 66, .16);
  --radius: 12px;
  --radius-sm: 8px;
  --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace;
}
[data-theme="dark"] {
  --mica-top: rgba(34, 40, 52, 0.90);
  --mica-bottom: rgba(22, 27, 38, 0.74);
  --glass: rgba(41, 48, 63, 0.72);
  --glass-strong: rgba(48, 56, 73, 0.9);
  --glass-2: rgba(34, 40, 53, 0.55);
  --glass-border: rgba(120, 133, 160, 0.22);
  --line: rgba(140, 155, 185, 0.16);
  --line-strong: rgba(140, 155, 185, 0.30);
  --text: #e8ecf5;
  --text-2: #a4aec4;
  --text-3: #727d96;
  --accent: #6a95f5;
  --accent-hover: #84aaf8;
  --accent-soft: rgba(106, 149, 245, 0.16);
  --accent-soft-strong: rgba(106, 149, 245, 0.30);
  --accent-text: #8fb0f8;
  --ok: #4cc28a; --ok-soft: rgba(76, 194, 138, .14);
  --warn: #e0a54f; --warn-soft: rgba(224, 165, 79, .14);
  --err: #f07080; --err-soft: rgba(240, 112, 128, .13);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .38), 0 0 0 0.5px rgba(0,0,0,.2);
  --shadow-md: 0 10px 32px rgba(0, 0, 0, .52);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  /* 半透明灰蓝渐变：Windows 11 下透出系统 Mica 原生材质（底色由主进程
     backgroundColor 兜底）；旧系统显示为近似纯色背景 */
  background:
    linear-gradient(180deg, var(--mica-top), var(--mica-bottom)) fixed;
  color: var(--text);
  font: 14px/1.55 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', system-ui, sans-serif;
  user-select: none; overflow: hidden;
  display: flex; flex-direction: column;
  transition: background .2s ease, color .2s ease;
}
button { font: inherit; cursor: pointer; }
input, select { font: inherit; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============ 顶栏：一体化控制（品牌 + 模式 + 设置） ============ */
.titlebar {
  height: 48px; flex-shrink: 0;
  display: flex; align-items: center; gap: 14px;
  -webkit-app-region: drag;
  background: var(--glass-strong);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(24px) saturate(1.4);
  padding: 0 16px;
  position: relative; z-index: 50;
}
.tb-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-logo {
  width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), #4f7ef0);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
  box-shadow: 0 2px 8px rgba(43, 95, 217, .35);
}
.tb-title { font-size: 14px; font-weight: 650; letter-spacing: .02em; }
.tb-title small { font-weight: 400; color: var(--text-3); font-size: 11px; margin-left: 8px; }

/* 顶栏中段：提取模式分段控件（高频，一眼可见；同步隐藏的 select#mode） */
.mode-seg {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--glass-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 3px; -webkit-app-region: no-drag;
}
.mode-seg button {
  border: none; background: transparent; color: var(--text-2);
  padding: 5px 13px; border-radius: 7px; font-size: 12.5px; font-weight: 550;
  transition: background .15s, color .15s, box-shadow .15s;
}
.mode-seg button:hover { color: var(--text); }
.mode-seg button.active {
  background: var(--glass-strong); color: var(--accent-text);
  box-shadow: var(--shadow-sm);
}
.mode-hint { font-size: 11.5px; color: var(--text-3); -webkit-app-region: no-drag; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--text-2);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-text); }
.icon-btn#settingsBtn { position: static; } /* 设置入口：顶栏图标（原左下角齿轮迁入） */
.tb-controls { display: flex; align-items: center; margin-left: 6px; }
.tb-controls button {
  width: 40px; height: 44px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--text-2); transition: background .12s, color .12s;
}
.tb-controls button:hover { background: var(--glass-2); color: var(--text); }
.tb-controls #tbClose:hover { background: var(--err); color: #fff; }
body.maximized .tb-controls .icon-max { display: none; }
body.maximized .tb-controls .icon-restore { display: block; }
.tb-controls .icon-restore { display: none; }

/* ============ 主区：单列工作流 ============ */
.main {
  flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto; padding: 14px 16px 16px; max-width: 1500px; margin: 0 auto; width: 100%;
}

/* 玻璃卡片 */
.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(20px) saturate(1.3);
}
.card-head {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
}
.card-head h2 { font-size: 13px; font-weight: 650; letter-spacing: .03em; }
.card-head .muted { margin-left: auto; font-size: 12px; color: var(--text-3); }

/* ============ 第一层：发票文件（拖拽宽条 + 进度条） ============ */
#fileCard { padding: 12px 14px 13px; flex-shrink: 0; }
.drop {
  border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm);
  padding: 14px 18px; cursor: pointer;
  display: flex; align-items: center; gap: 16px;
  background: var(--glass-2);
  transition: border-color .18s, background .18s, transform .1s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop-icon { display: flex; flex-shrink: 0; color: var(--accent-text); }
.drop-text { text-align: left; min-width: 0; }
.drop-title { font-size: 15px; font-weight: 650; }
.drop-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.drop-btns { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }

/* 识别进度条（第一层卡内） */
.parse-progress { margin-top: 10px; padding: 8px 12px; background: var(--glass-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.pp-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.pp-text { flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp-stage { display: inline-block; margin-right: 6px; padding: 1px 7px; font-size: 11px; font-weight: 600; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); }
.pp-stage.llm { background: var(--warn-soft); color: var(--warn); }
.pp-count { font-size: 12px; color: var(--text-3); font-family: var(--mono); }
.pp-track { height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; }
.pp-bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #5f8bf0); transition: width .22s ease; }
.pp-bar.llm { background: linear-gradient(90deg, #d97706, #f59e0b); background-size: 200% 100%; animation: pp-stripes 1.1s linear infinite; }
@keyframes pp-stripes { from { background-position: 0 0; } to { background-position: 200% 0; } }
.pp-bar.done { background: var(--ok); animation: none; }

/* ============ 第二层：命名模板（可折叠） ============ */
#tplCard { padding: 12px 14px 11px; flex-shrink: 0; }
.tpl-collapse {
  background: transparent; border: none; color: var(--text-3); font-size: 12px;
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 5px;
  margin-left: 2px;
}
.tpl-collapse:hover { background: var(--glass-2); color: var(--text); }
.row-ctl { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.row-ctl.nowrap { flex-wrap: nowrap; }
.row-ctl.nowrap > .btn { flex-shrink: 0; white-space: nowrap; }
.row-ctl input[type=text] { width: auto; }
.sep-group { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; white-space: nowrap; }
.preset-inline { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; white-space: nowrap; }
.sep-grp { margin-right: 2px; color: var(--text-3); font-size: 12px; }
.chips {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 36px;
  background: var(--glass-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 7px 10px; margin: 0 0 8px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--glass-strong); border: 1px solid var(--line-strong);
  color: var(--text); border-radius: 999px; padding: 4px 7px 4px 12px;
  font-size: 12.5px; cursor: grab;
  transition: box-shadow .15s, opacity .15s, border-color .15s;
}
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .5; flex-shrink: 0; }
.chip.sep { background: var(--glass-2); color: var(--text-2); font-family: var(--mono); }
.chip .tag { font-size: 10px; color: var(--text-3); }
.chip button { background: transparent; border: none; color: inherit; opacity: .5; width: 16px; height: 16px; border-radius: 50%; font-size: 11px; cursor: pointer; line-height: 1; }
.chip button:hover { opacity: 1; color: var(--err); background: var(--err-soft); }
.chip.dragging { background: transparent; border: 1.5px dashed var(--accent); color: transparent; box-shadow: none; }
.chip.dragging::before { opacity: 0; }
.chip:active { cursor: grabbing; }
.preview {
  background: var(--glass-2); border: 1px solid var(--line);
  border-left: 3px solid var(--accent); border-radius: var(--radius-sm);
  padding: 8px 12px; font-family: var(--mono); font-size: 12.5px; color: var(--text-2); word-break: break-all;
}
.preview b { color: var(--accent-text); font-weight: 600; }
.preview .hint { color: var(--text-3); font-family: inherit; font-size: 11px; margin-top: 3px; }

/* ============ 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; gap: 5px; justify-content: center;
  background: var(--accent); color: var(--on-accent); border: 1px solid transparent;
  border-radius: var(--radius-sm); padding: 7px 14px; font-size: 13px; font-weight: 550;
  white-space: nowrap; transition: background .15s, box-shadow .15s, transform .05s, border-color .15s;
}
.btn:hover { background: var(--accent-hover); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { box-shadow: var(--focus); outline: none; }
.btn-soft { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-soft-strong); }
.btn-soft:hover { background: var(--accent-soft-strong); color: var(--accent-text); }
.btn-ghost { background: var(--glass-2); color: var(--text-2); border: 1px solid var(--line); }
.btn-ghost:hover { color: var(--text); background: var(--glass-strong); }
.btn-danger { background: var(--err); border-color: var(--err); }
.btn-danger:hover { background: #a5313f; filter: none; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-lg { padding: 9px 16px; font-size: 13.5px; }
.card-foot { display: flex; align-items: center; gap: 10px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); }
.hint-muted { color: var(--text-3); font-size: 11.5px; margin-left: 6px; }
.muted { color: var(--text-3); font-size: 12px; }

/* ============ 表单 ============ */
.field { margin-bottom: 11px; }
.field:last-child { margin-bottom: 0; }
label.f { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; font-weight: 550; }
input[type=text], input[type=password], select {
  width: 100%; background: var(--glass-2); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 7px 10px; font-size: 13px; outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input:focus, select:focus { border-color: var(--accent); box-shadow: var(--focus); background: var(--glass-strong); }
select { cursor: pointer; }

/* ============ 第三层：识别结果（主区域，最大面积） ============ */
#resultCard { flex: 1; min-height: 120px; display: flex; flex-direction: column; padding: 12px 14px 13px; }
.tbl-wrap { flex: 1; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--glass-2); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  text-align: left; color: var(--text-3); font-weight: 600; font-size: 11.5px;
  padding: 8px 12px; border-bottom: 1px solid var(--line-strong);
  background: var(--glass); white-space: nowrap; position: sticky; top: 0; backdrop-filter: blur(16px);
  z-index: 1;
}
th.num, td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--glass); }
.fname { font-family: var(--mono); font-size: 12px; color: var(--text-2); word-break: break-all; }
.new {
  width: 100%; min-width: 220px; background: var(--glass-strong); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; outline: none;
  font-family: var(--mono); resize: none; overflow-y: hidden; line-height: 1.5; word-break: break-all;
  transition: border-color .15s, box-shadow .15s;
}
.new:focus { border-color: var(--accent); box-shadow: var(--focus); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 550; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.partial { background: var(--warn-soft); color: var(--warn); }
.badge.failed { background: var(--err-soft); color: var(--err); }
.fchip {
  display: inline-block; background: var(--glass-strong); border: 1px solid var(--line);
  border-radius: 5px; padding: 1px 7px; margin: 1px 2px; font-size: 11.5px; color: var(--text-2);
}
.fchip b { color: var(--accent-text); font-weight: 600; margin-right: 3px; }
.ferr { color: var(--err); font-size: 11.5px; margin-top: 2px; }
.expand-btn { background: none; border: none; color: var(--accent-text); cursor: pointer; font-size: 11.5px; padding: 3px 2px 0; font-weight: 550; }
.expand-btn:hover { text-decoration: underline; }
tfoot td { background: var(--glass); border-top: 1px solid var(--line-strong); font-size: 12.5px; white-space: nowrap; position: sticky; bottom: 0; backdrop-filter: blur(16px); }
.totals .sum { font-weight: 700; color: var(--text); }
.totals .sum b { font-weight: 700; color: var(--accent-text); font-family: var(--mono); }
.totals .na { color: var(--warn); font-weight: 500; margin-left: 12px; }

/* 行操作列：🤖 LLM 重识别 + 移除（竖排） */
.row-ops { display: flex; flex-direction: column; align-items: stretch; gap: 5px; }
.llm-rebtn {
  background: var(--glass-strong); border: 1px solid var(--accent-soft-strong); color: var(--accent-text);
  height: 26px; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: 600;
  white-space: nowrap; line-height: 1; padding: 0 8px; transition: background .15s, color .15s, opacity .15s;
}
.llm-rebtn:hover:not(:disabled) { background: var(--accent); color: #fff; }
.llm-rebtn:disabled { opacity: .5; cursor: wait; }
.rm-btn { background: transparent; border: 1px solid var(--line); color: var(--text-3); width: 26px; height: 26px; border-radius: 6px; font-size: 12px; line-height: 1; }
.rm-btn:hover { color: var(--err); border-color: var(--err); background: var(--err-soft); }

/* 操作条：固定在结果卡底部 */
.actions { display: flex; gap: 9px; margin-top: 11px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
.spacer { flex: 1; }

/* ============ 设置弹窗（顶栏 ⚙ 打开） ============ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(20, 28, 46, .35);
  backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  width: 460px; max-width: calc(100vw - 44px); max-height: calc(100vh - 80px);
  display: flex; flex-direction: column;
  background: var(--glass-strong); border: 1px solid var(--glass-border);
  border-radius: 16px; box-shadow: var(--shadow-md);
  backdrop-filter: blur(28px) saturate(1.4);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px 13px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 14px; font-weight: 650; }
.modal-x { background: transparent; border: none; color: var(--text-3); width: 28px; height: 28px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.modal-x:hover { background: var(--glass-2); color: var(--text); }
.modal-body { padding: 16px 18px 4px; overflow-y: auto; }
.modal-body .field { margin-bottom: 13px; }
.modal-sec-title { font-size: 11.5px; font-weight: 650; letter-spacing: .06em; color: var(--accent-text); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.modal-foot { display: flex; align-items: center; gap: 9px; padding: 13px 18px 16px; margin-top: 6px; }
.modal-foot .spacer { flex: 1; }

/* ============ Toast / 滚动条 ============ */
#toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  background: var(--glass-strong); color: var(--text); border: 1px solid var(--line-strong);
  border-radius: 10px; padding: 10px 18px; font-size: 13px; display: none; z-index: 99;
  box-shadow: var(--shadow-md); backdrop-filter: blur(20px);
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 1100px) {
  .drop-btns { flex-direction: column; gap: 6px; }
}
</style>
</head>
<body data-theme="light">

<!-- 顶栏：一体化控制（品牌 + 模式 + 主题 + 设置 + 窗口） -->
<div class="titlebar">
  <div class="tb-brand">
    <div class="tb-logo" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <rect x="5.2" y="3.6" width="13.6" height="16.8" rx="2.4" fill="#ffffff"/>
        <rect x="3.8" y="8.2" width="16.4" height="3.8" rx="1.4" fill="#4f7ef0"/>
        <rect x="7.6" y="14" width="8.4" height="1.9" rx="0.95" fill="#c8d6f2"/>
      </svg>
    </div>
    <span class="tb-title">发票识别重命名 <small>桌面版 · 原地重命名 · 支持撤销</small></span>
  </div>

  <!-- 提取模式分段控件（高频，顶栏常驻；操作同步隐藏的 select#mode） -->

<script>
const $ = id => document.getElementById(id);
let template = [];   // [{t:'field'|'sep', v:...}]
let items = [];      // 当前解析结果
let lastDirs = [];   // 最近处理的文件夹（用于重命名后刷新）
let lastSummary = null; // 最近一次批量识别的统计（LLM 调用次数/tokens）
let themeMode = 'system';
let modelValue = '';   // 当前模型值（select/input 两种形态间保持）
let keyStates = {};    // 各提供商 key 状态（主进程脱敏视图：{masked, has}，无明文）
let keyDraft = {};     // 用户本次会话未提交的 key 输入（provider -> 明文输入/'__clear__'）
let draggingIdx = -1;  // 拖拽中的模板段索引（实时重排用）
let reorderQueued = false; // rAF 节流：一帧内最多重排一次
let dragSeg = null;    // 被拖的模板段（对象引用）

const LABELS = {
  invoice_no: '发票号码', date: '开票日期', seller: '销售方', buyer: '购买方',
  amount_excl: '金额', tax: '税额', amount: '价税合计', amount_cn: '金额大写', type: '票种',
  seller_tax_id: '销售方税号', buyer_tax_id: '购买方税号'
};

const DEMO_FIELDS = {
  invoice_no: '25512345678901234567', date: '2026年08月15日',
  seller: '深圳市某某科技有限公司', buyer: '北京某某商贸有限公司',
  amount_excl: '88.50', tax: '11.50', amount: '100.00', amount_cn: '壹佰元整', type: '电子普通发票',
  seller_tax_id: '91440300MA5XXXXXX1', buyer_tax_id: '91110108XXXXXXXX2'
};

const PRESETS = {
  default: [['field','date'],['sep','_'],['field','invoice_no'],['sep','_'],['field','seller'],['sep','_'],['field','amount']],
  dni:     [['field','date'],['sep','_'],['field','invoice_no'],['sep','_'],['field','amount']],
  nis:     [['field','invoice_no'],['sep','_'],['field','seller'],['sep','_'],['field','amount']],
  sda:     [['field','seller'],['sep','_'],['field','date'],['sep','_'],['field','amount']],
  dtna:    [['field','date'],['sep','_'],['field','type'],['sep','_'],['field','invoice_no'],['sep','_'],['field','amount']]
};

function toast(msg, ms = 3500) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms);
}

/* ---------- 主题 ---------- */
function resolveTheme(mode) {
  if (mode === 'system') return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  return mode;
}
function applyTheme() {
  themeMode = $('theme').value;
  document.documentElement.dataset.theme = resolveTheme(themeMode);
  document.body.dataset.theme = document.documentElement.dataset.theme;
  const mq = matchMedia('(prefers-color-scheme: dark)');
  if (themeMode === 'system' && !mq._bound) {
    mq._bound = true;
    mq.addEventListener('change', () => { if (themeMode === 'system') applyTheme(); });
  }
}
// 顶栏主题图标：循环 亮色 → 暗色 → 跟随系统（同步隐藏 select#theme 后保存）
function cycleTheme() {
  const order = ['light', 'dark', 'system'];
  const cur = $('theme').value || 'system';
  const next = order[(order.indexOf(cur) + 1) % order.length];
  $('theme').value = next;
  $('themeSel').value = next;
  applyTheme();
  saveConfig();
}

/* ---------- 配置 ---------- */
const PROVIDER_PRESETS = {
  deepseek: { base_url: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  opencode: { base_url: 'https://opencode.ai/zen/go/v1', model: 'deepseek-v4-flash' },
  custom: { base_url: '', model: '' },
};
function providerDefaults(p) { return PROVIDER_PRESETS[p] || { base_url: '', model: '' }; }
function onProviderChange() {
  const p = $('llmProvider').value;
  const prev = $('llmProvider').dataset.prevProvider || '';
  const prevDef = providerDefaults(prev);
  const curBase = $('llmBase').value.trim();
  const curModel = modelValue.trim();
  // 用户在当前输入框输入的内容暂存到 draft（不落盘、不进配置，切回来不丢）
  if (prev && prev !== p) {
    const v = $('llmKey').value;
    if (v) keyDraft[prev] = v; // 只记录真实输入；清空/清除标记保留原 draft
  }
  // Base URL / 模型：仅在空值或等于上一个提供商默认值时替换为新默认
  if (!curBase || curBase === prevDef.base_url) $('llmBase').value = providerDefaults(p).base_url;
  if (!curModel || curModel === prevDef.model) modelValue = providerDefaults(p).model;
  $('llmProvider').dataset.prevProvider = p;
  renderModelField();
  applyKeyField(p);
  fetchModels(false);
}
// 模型字段：有模型列表 → 真下拉 select（全部可见）；无列表 → 可输入文本框
function renderModelField(list) {
  const wrap = $('llmModelWrap');
  const models = list || null;
  const val = modelValue || '';
  if (models && models.length) {
    const opts = models.slice();
    if (val && !opts.includes(val)) opts.unshift(val);
    wrap.innerHTML = `<select id="llmModel" style="width:100%">${opts.map(m => `<option value="${m}">${m}</option>`).join('')}</select>`;
    const sel = $('llmModel');
    sel.value = val && opts.includes(val) ? val : opts[0];
    modelValue = sel.value;
  } else {
    wrap.innerHTML = `<input type="text" id="llmModel" list="modelList" placeholder="点↻刷新获取模型">`;
    $('llmModel').value = val;
  }
  $('llmModel').addEventListener('change', () => { modelValue = $('llmModel').value; });
}
async function fetchModels(showErrors) {
  const base = $('llmBase').value.trim();
  const key = $('llmKey').value.trim(); // 只有用户草稿；已保存 key 由主进程回填
  if (!base) {
    renderModelField();
    if (showErrors) toast('请先填写 Base URL');
    return;
  }
  try {
    const res = await window.invoiceAPI.listModels({ base_url: base, api_key: key, provider: $('llmProvider').value });
    if (res.error) throw new Error(res.error);
    const list = res.models || [];
    if (showErrors) toast(list.length ? `已获取 ${list.length} 个模型` : '该服务没有返回模型列表', 4000);
    renderModelField(list);
  } catch (e) {
    renderModelField();
    if (showErrors) toast('获取模型列表失败：' + e.message, 5000);
  }
}
// API Key 字段展示：只看掩码/草稿，无明文回填
function applyKeyField(p) {
  const st = keyStates[p] || {};
  const d = keyDraft[p];
  const input = $('llmKey');
  $('llmClearBtn').style.display = st.has && !d ? 'inline-flex' : 'none';
  if (d === '__clear__') {
    input.value = '';
    input.placeholder = '将清除已保存的 Key（保存后生效）';
  } else if (d) {
    input.value = d;
    input.placeholder = st.has ? 'sk-…（已保存，留空则保留）' : 'sk-…';
  } else {
    input.value = '';
    input.placeholder = st.has ? st.masked + '（已保存，留空则保留）' : 'sk-…（未配置）';
  }
}
function clearSavedKey() {
  keyDraft[$('llmProvider').value] = '__clear__';
  applyKeyField($('llmProvider').value);
}
// key 输入监听：写入 draft 并即时刷新按钮态（与主界面 .new textarea 委托共存）
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'llmKey') {
    keyDraft[$('llmProvider').value] = e.target.value;
    applyKeyField($('llmProvider').value);
  }
});
function onModeChange() {
  const m = $('mode').value;
  const hints = {
    regex: '当前：仅本地正则 — 离线运行，不调用任何 LLM，无需 API Key。',
    hybrid: '当前：混合模式 — 正则优先，关键字段缺失时自动调用 LLM 补全。',
    llm: '当前：仅 LLM — 所有字段都由大模型提取，需要配置 API Key。'
  };
  $('modeHint').textContent = hints[m];
  // 同步顶栏分段控件选中态
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  if (items.length) renderTable(); // 重绘以显示/隐藏「🤖 LLM 重识别」按钮（LLM 模式隐藏）
}
// 顶栏模式分段控件：同步隐藏 select#mode 后保存（模式是高频操作，切换即生效）
function setModeSeg(m, btn) {
  $('mode').value = m;
  onModeChange();
  saveConfig();
}
function parsingToast() {
  return {
    regex: '解析中…（仅本地正则，不调用 LLM）',
    hybrid: '解析中…（hybrid 模式，缺字段才调 LLM，请稍候）',
    llm: '解析中…（LLM 模式，请稍候）'
  }[$('mode').value] || '解析中…';
}
/* ---------- 识别进度条：主进程逐文件推送 { phase, done, total, filename } ---------- */
let progressTimer = null;
function showProgress() {
  clearTimeout(progressTimer); // 清掉上一批的延迟隐藏，防止误藏新进度
  const box = $('parseProgress');
  box.style.display = 'block';
  $('ppBar').classList.remove('done', 'llm');
  $('ppBar').style.width = '0%';
  $('ppText').innerHTML = '<span class="pp-stage">准备中</span> 等待主进程…';
  $('ppCount').textContent = '';
}
function updateProgress(p) {
  const box = $('parseProgress');
  if (box.style.display !== 'block') showProgress();
  const bar = $('ppBar');
  const stageTxt = p.phase === 'llm' ? '<span class="pp-stage llm">🤖 LLM 补全中…</span>'
    : '<span class="pp-stage">本地解析</span>';
  $('ppText').innerHTML = `${stageTxt} <span title="${escapeHtml(p.filename || '')}">${escapeHtml(p.filename || '')}</span>`;
  $('ppCount').textContent = `${Math.min(p.done + 1, p.total)} / ${p.total}`;
  const pct = p.total ? Math.round(((p.done + 1) / p.total) * 100) : 0;
  bar.style.width = Math.max(4, Math.min(100, pct)) + '%';
  bar.classList.toggle('llm', p.phase === 'llm');
}
function finishParseProgress(count, summary) {
  clearTimeout(progressTimer);
  const box = $('parseProgress');
  if (!box || box.style.display !== 'block') return;
  const pct = $('ppBar').style.width;
  if (pct && pct !== '0%') { // 至少推进过 → 短暂显示「完成」再收起

function renderTemplate() {
  const box = $('templateChips'); box.innerHTML = '';
  template.forEach((seg, i) => {
    const d = document.createElement('span');
    d.dataset.idx = i;
    if (seg.t === 'field') {
      d.className = 'chip';
      d.innerHTML = `<span class="tag">字段</span>${LABELS[seg.v] || seg.v}`;
    } else {
      d.className = 'chip sep';
      d.innerHTML = `<span class="tag">分隔</span>${seg.v === ' ' ? '␣' : seg.v}`;
    }
    d.draggable = true;
    d.addEventListener('dragstart', e => {
      draggingIdx = +d.dataset.idx;
      dragSeg = template[draggingIdx];
      e.dataTransfer.setData('text/plain', String(draggingIdx));
      e.dataTransfer.effectAllowed = 'move';
      d.classList.add('dragging');
    });
    d.addEventListener('dragend', () => {
      d.classList.remove('dragging');
      draggingIdx = -1; dragSeg = null;
      renderTemplate(); // 归位重渲染（含自动保存）
    });
    d.addEventListener('dragover', e => e.preventDefault()); // 允许放置（重排统一由容器处理）
    d.addEventListener('drop', e => { e.preventDefault(); });
    const rm = document.createElement('button'); rm.textContent = '✕'; rm.title = '删除';
    rm.onclick = e => { e.stopPropagation(); template.splice(+d.dataset.idx, 1); renderTemplate(); };
    d.appendChild(rm);
    box.appendChild(d);
  });
  // 容器统一处理重排（监听只绑一次）
  if (!box._bound) {
    box._bound = true;
    box.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (draggingIdx === -1 || reorderQueued) return;
      reorderQueued = true;
      const x = e.clientX, y = e.clientY;
      requestAnimationFrame(() => {
        reorderQueued = false;
        if (draggingIdx === -1) return;
        const chips = [...box.children];
        const dragEl = chips[draggingIdx];
        if (!dragEl) return;
        const insertIdx = computeInsertIdx(box, x, y, dragEl);
        let anchor = null, count = 0;
        for (const c of chips) {
          if (c === dragEl) continue;
          if (count === insertIdx) { anchor = c; break; }
          count++;
        }
        if (anchor) box.insertBefore(dragEl, anchor);
        else box.appendChild(dragEl);
        template = [...box.children].map(c => template[+c.dataset.idx]);
        [...box.children].forEach((c, i) => { c.dataset.idx = i; });
        draggingIdx = template.indexOf(dragSeg);
      });
    });
    box.addEventListener('drop', e => { e.preventDefault(); }); // 落点已由 dragover 定位，dragend 收尾
  }
  renderPreview();
  refreshSuggestedNames();
  scheduleTemplateSave();
}

// 计算插入槽位：按行分组，光标所在行内按中点 < x 计数，上方行全计
function computeInsertIdx(box, x, y, dragEl) {
  const chips = [...box.children].filter(c => c !== dragEl);
  const rows = [];
  for (const c of chips) {
    const r = c.getBoundingClientRect();
    let row = rows.find(rw => Math.abs(rw.top - r.top) <= 8);
    if (!row) { row = { top: r.top, items: [] }; rows.push(row); }
    row.items.push({ r });
  }
  rows.sort((a, b) => a.top - b.top);
  if (!rows.length) return 0;
  let cursorRow = rows[0], best = Infinity;
  for (const row of rows) {
    const d = Math.abs(row.top - y);
    if (d < best) { best = d; cursorRow = row; }
  }
  let idx = 0;
  for (const row of rows) {
    if (row === cursorRow) {
      for (const { r } of row.items) if (r.left + r.width / 2 < x) idx++;
      break;
    }
    idx += row.items.length;
  }
  return idx;
}

function renderTemplateJS(tpl, fields) {

  for (const seg of tpl) {
    if (seg.t === 'field') {
      const val = (fields[seg.v] || '').trim();
      if (val) { if (pendingSep !== null && tokens.length) tokens.push(pendingSep); pendingSep = null; tokens.push(val); }
    } else pendingSep = seg.v;

  return tokens.join('');
}

/* ---------- 文件 ---------- */
function fileFromEntry(entry) {
  return new Promise((resolve, reject) => entry.file(resolve, reject));
}
function readDirEntries(dirEntry) {
  return new Promise((resolve, reject) => {
    const reader = dirEntry.createReader();
    const all = [];
    const readBatch = () => {
      reader.readEntries(async entries => {
        if (!entries.length) { resolve(all); return; }
        for (const ent of entries) {
          if (ent.isFile) all.push(await fileFromEntry(ent));
          else if (ent.isDirectory) all.push(...await readDirEntries(ent));
        }
        readBatch(); // Chromium 要求重复调用直到返回空
      }, reject);
    };
    readBatch();
  });
}
async function collectDroppedPaths(e) {
  const paths = [];
  const seen = new Set();
  const addPath = p => { if (p && !seen.has(p)) { seen.add(p); paths.push(p); } };
  let sawDir = false;
  // 通道 1：dataTransfer.files（多文件拖入时非空，File 对象带绝对路径）
  for (const f of (e.dataTransfer.files || [])) {
    if (/\.pdf$/i.test(f.name)) addPath(window.invoiceAPI.getPathForFile(f));
  }
  // 通道 2：items → webkitGetAsEntry（文件夹需要递归遍历子目录）
  const items = [...(e.dataTransfer.items || [])];
  for (const item of items) {
    const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
    if (!entry) continue;
    if (entry.isFile) {
      const f = await fileFromEntry(entry);
      if (/\.pdf$/i.test(f.name)) addPath(window.invoiceAPI.getPathForFile(f));
    } else if (entry.isDirectory) {
      sawDir = true;
      const files = await readDirEntries(entry);
      for (const f of files) {
        if (/\.pdf$/i.test(f.name)) addPath(window.invoiceAPI.getPathForFile(f));
      }
    }
  }
  return { paths, sawDir };
}
function setupDrop() {
  const drop = $('drop');
  ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', async e => {
    e.preventDefault();
    try {
      const { paths, sawDir } = await collectDroppedPaths(e);
      if (!paths.length) {
        toast(sawDir ? '该文件夹中没有找到 PDF 文件' : '没有找到 PDF 文件（可尝试「选择文件夹」或「选择文件」按钮）', 5000);
        return;
      }
      const unique = [...new Set(paths)].sort();
      lastDirs = [...new Set(unique.map(p => p.replace(/[\\/][^\\/]+$/, '')))];
      await runParse(unique);
    } catch (err) {

  });
}

// 合并：已存在的文件按路径原位更新，新文件追加（不替换现有列表）

// 构建单行（独立函数：LLM 重识别成功后只替换该行，不整表重绘以免丢失其他行手改的新文件名）
function buildRow(it, idx) {
  const tr = document.createElement('tr');
  const expanded = expandedRows.has(it.src);
  const allChips = Object.entries(it.fields).filter(([, v]) => v);
  const shown = expanded ? allChips : allChips.filter(([k]) => KEY_FIELD_KEYS.includes(k));
  const fieldChips = shown.map(([k, v]) =>
    `<span class="fchip"><b>${LABELS[k] || k}</b> ${escapeHtml(v)}</span>`).join('');
  const more = !expanded && allChips.length > shown.length;
  const badge = { ok: '✓ 完整', partial: '⚠ 部分', failed: '✕ 失败' }[it.status];

  const showLlmBtn = $('mode').value !== 'llm';
  tr.innerHTML = `
    <td><div class="fname">${escapeHtml(it.filename)}</div></td>

        ${expanded ? `<button class="expand-btn" onclick="toggleExpand(${idx})">⌃ 收起</button>` : ''}
        ${it.llm_used ? `<span class="fchip" title="${it.llm_usage ? `输入 ${(it.llm_usage.input ?? 0).toLocaleString()} / 输出 ${(it.llm_usage.output ?? 0).toLocaleString()} / 合计 ${(it.llm_usage.total ?? 0).toLocaleString()} tokens` : ''}">🤖 LLM补全${it.llm_usage && it.llm_usage.total ? ` ${(it.llm_usage.total).toLocaleString()}t` : ''}</span>` : ''}
        ${it.llm_error ? `<div class="ferr">LLM: ${escapeHtml(it.llm_error)}</div>` : ''}
        ${it.errors.map(e => `<div class="ferr">${escapeHtml(e)}</div>`).join('')}</td>
    <td><textarea class="new" data-idx="${idx}" rows="1">${escapeHtml(renderTemplateJS(template, it.fields))}</textarea></td>

      <button class="rm-btn" title="移除该文件" onclick="removeRow(${idx})">✕</button>
    </div></td>`;
  return tr;
}

// 单文件强制 LLM 重识别：只更新该行，成功累加本次 LLM 次数/tokens 到全局统计；
// 失败保留原字段，行内显示 LLM 错误
async function reparseWithLlm(idx, btn) {
  const it = items[idx];
  if (!it) return;
  if (btn) { btn.disabled = true; btn.textContent = '🤖 识别中…'; }
  try {
    const res = await window.invoiceAPI.reparseWithLlm(it.src);
    items[idx] = res.item;
    // 累加统计：本次是手动单文件 LLM 调用（用户主动要求，需如实计入）
    lastSummary = lastSummary || { llm_calls: 0, tokens: { input: 0, output: 0, total: 0 } };
    lastSummary.llm_calls += 1;
    const u = res.usage || {};
    lastSummary.tokens.input += u.input || 0;
    lastSummary.tokens.output += u.output || 0;
    lastSummary.tokens.total += u.total || 0;
    replaceRow(idx);
    toast(`✓ ${it.filename} 已由 LLM 重新识别（${res.item.status === 'ok' ? '完整' : res.item.status === 'partial' ? '部分' : '失败'}）`);
  } catch (e) {
    items[idx].llm_error = String(e.message || e);
    replaceRow(idx);
    toast('LLM 重识别失败：' + e.message, 5000);
  }
}

  return [...document.querySelectorAll('.new')].map(inp => ({
    src: items[+inp.dataset.idx].src,
    // 文件名不允许换行：textarea 折行只是显示，提交时去除换行符
    new_name: inp.value.replace(/[\r\n]+/g, '').trim(),
    fields: items[+inp.dataset.idx].fields
  }));
}
async function renameAll() {
  if (!items.length) return;
  toast('重命名中…');
  try {
    const res = await window.invoiceAPI.rename(currentNewNames());
    let ok = 0, fails = [];
    res.results.forEach(r => r.ok ? ok++ : fails.push(r.message));
    // 原位更新列表（只更新被重命名的行，不重新扫描文件夹）
    const bySrc = new Map(res.results.map(r => [r.src, r]));
    for (const it of items) {
      const r = bySrc.get(it.src);
      if (r && r.ok && r.new_path) {
        it.src = r.new_path;
        it.filename = basename(r.new_path);
      }
    }
    renderTable(); renderMeta();
    toast(`重命名完成：成功 ${ok} 个` + (fails.length ? `；失败 ${fails.length} 个（${fails[0]}）` : ''), 6000);
  } catch (e) { toast('重命名失败：' + e.message, 6000); }
}
async function reparse() {
  if (!items.length) return;
  await runParse(items.map(i => i.src));
}
async function undo() {
  try {
    const res = await window.invoiceAPI.undo();
    toast(res.message, 6000);
    // 撤销后原位还原文件名（只更新匹配的行）
    if (res.records) {
      const byNew = new Map(res.records.map(r => [r.new, r.old]));
      for (const it of items) {
        if (byNew.has(it.src)) {
          it.src = byNew.get(it.src);
          it.filename = basename(it.src);
        }
      }
      renderTable(); renderMeta();
    }
  } catch (e) { toast('撤销失败：' + e.message, 6000); }
}
function basename(p) {
  const parts = String(p).split(/[\\/]/);
  return parts[parts.length - 1];
}

/* ---------- 模板卡折叠（布局交互，与数据逻辑无关） ---------- */
function toggleTpl() {
  const body = $('tplBody'), btn = $('tplToggle');
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? 'block' : 'none';
  btn.textContent = hidden ? '⌃ 折叠' : '⌄ 展开';
}

/* ---------- 初始化 ---------- */
(async function init() {
  const sel = $('fieldSel');
  sel.innerHTML = Object.entries(LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  setupDrop();
  // 识别进度订阅：主进程逐文件推送（混合/LLM 模式耗时明显）
  window.invoiceAPI.onParseProgress(p => {
    if (p && typeof p.done === 'number') updateProgress(p);
  });
  await loadConfig();
  // 自绘标题栏：窗口控制按钮
  const wc = window.invoiceAPI.windowControls;
  $('tbMin').onclick = () => wc.minimize();
  $('tbMax').onclick = () => wc.maximizeToggle();
  $('tbClose').onclick = () => wc.close();
  wc.onMaximizedChange(v => {
    document.body.classList.toggle('maximized', v);
    $('tbMax').title = v ? '还原' : '最大化';
  });
})();
</script>
